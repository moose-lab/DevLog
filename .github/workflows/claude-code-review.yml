name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        env:
          # Repo uses a custom Anthropic-compatible endpoint
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # Visual progress tracking comment, updated as the review proceeds
          track_progress: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Perform a focused, actionable code review. Prioritize the most
            important issues and keep feedback concise. Cover:

            1. **Correctness** — logic bugs, unhandled edge cases, error handling
            2. **Security** — input validation, auth/authz, secret handling
            3. **Performance** — obvious bottlenecks, wasteful queries, leaks
            4. **Maintainability** — readability, naming, dead code, duplication
            5. **Testing** — missing coverage for new/changed behavior

            Use inline comments for specific lines and a short top-level summary.
            Be constructive; call out what's done well, not only problems.

          # Tools available to the reviewer
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
