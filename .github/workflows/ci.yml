name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        # TZ is pinned to Asia/Shanghai because cost-tracker.test.ts uses
        # +08:00 timestamps and aggregateCostReport bucket boundaries are
        # computed via dayjs(...).startOf("day"), which is system-TZ-coupled.
        # TODO: make aggregateCostReport TZ-agnostic and drop this pin.
        env:
          TZ: Asia/Shanghai
        run: bun run test

      - name: Build (Next.js)
        run: bun run build

      - name: Build (CLI)
        run: bun run build:cli
